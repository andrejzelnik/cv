name: Build CV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Build PDF
        run: typst compile --font-path fonts cv.typ Andrej_Zelnik_CV.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: Andrej_Zelnik_CV
          path: Andrej_Zelnik_CV.pdf

      - name: Commit PDF to repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Andrej_Zelnik_CV.pdf
          git diff --cached --quiet || git commit -m "build: update Andrej_Zelnik_CV.pdf"
          git push
